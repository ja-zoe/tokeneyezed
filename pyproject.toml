[project]
name = "tokeneyezed"
version = "0.1.0"
description = "Long-horizon harness: a LangGraph controller driving headless coding agents, with an observer-gated memory in MongoDB Atlas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.12",
    "langgraph-checkpoint-mongodb>=0.5.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
